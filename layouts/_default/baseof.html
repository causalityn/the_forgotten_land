<!doctype html>
<html lang="{{ site.Language.Locale | default "zh-cn" }}" data-theme="{{ site.Params.defaultTheme | default "system" }}">
  <head>
    {{ partial "head.html" . }}
  </head>
  <body>
    <a class="skip-link" href="#main-content">跳到主要内容</a>
    <div class="site-shell">
      {{ partial "header.html" . }}
      <main id="main-content" class="site-main" tabindex="-1">
        {{ block "main" . }}{{ end }}
      </main>
      {{ partial "footer.html" . }}
    </div>
    {{ partial "tool-dock.html" . }}
    <script src="{{ "js/main.js" | relURL }}" defer></script>
  </body>
</html>
