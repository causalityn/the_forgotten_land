<div class="tool-dock">
  <button class="tool-button" type="button" data-theme-toggle title="切换主题">
    <span class="visually-hidden" data-theme-label>切换主题</span>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M12 3a6 6 0 0 0 9 7.4A9 9 0 1 1 12 3Z"/>
    </svg>
  </button>
  <button class="tool-button" type="button" data-toc-toggle title="显示目录" aria-pressed="false" hidden>
    <span class="visually-hidden">显示或隐藏目录</span>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M8 6h13"/>
      <path d="M8 12h13"/>
      <path d="M8 18h13"/>
      <path d="M3 6h.01"/>
      <path d="M3 12h.01"/>
      <path d="M3 18h.01"/>
    </svg>
  </button>
  <button class="tool-button" type="button" data-back-top title="回到顶部">
    <span class="visually-hidden">回到顶部</span>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="m18 15-6-6-6 6"/>
    </svg>
  </button>
</div>
